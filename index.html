<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet dispencer 26</title>
    <link rel="stylesheet" href="index.css">
</head>
<body class="container">
    <h1>Pet Food Dispencer</h1>
    <div class="regolatori">
        <div class="slider">
             <p>Erogazione</p>
             <input min="0" max="4" type="range" name="" id="erogazione">
             <p id="erogazione_val"></p>
        </div>
        <div class="slider">
             <p>Quantita di cibo</p>
              <input min="0" max="4" type="range" name="" id="quantita">
              <p id="quantita_val"></p>
        </div>
        <div class="slider">
            <p>Periodo</p>
            <input min="0" max="4" type="range" name="" id="periodo">
            <p id="periodo_val"></p>
        </div>
        <div class="slider">
            <input type="button" value="SET" id="btn_setswitch" onclick="setAjaxSwitch()">
        </div>
    </div>
    <div id="nextdis">
    </div>
    <div id="actualmode">
    </div>
    <div class="button">
        <input onclick="setMode(MANUALMODE)" type="button" value="SET MANUAL" id="btnmanualmode">
        <input onclick="setMode(REMOTEMODE)" type="button" value="SET REMOTE" id="btnremotemode">
    </div>
    <script>
        const URL = 'http://192.168.43.185/';
        const MANUALMODE = 'MANUAL';
        const REMOTEMODE = 'REMOTE';
        function ajax(method, api, callback) {
            let xhr = new XMLHttpRequest();
            xhr.open(method, URL+api );
            xhr.onload = ()=>callback(xhr.response);
            xhr.send();
        }

        let timerId=undefined;
        function startReadSwitches() {
            if (timerId!==undefined) {
                console.log("timerID already in use");
                return;
            }
            timerId = setInterval(() => {
                readswitch();
            }, 1000);
        }
        function stopReadSwitches() {
            clearInterval(timerId);
            timerId=undefined
        }

        let timerNextDistribution=undefined
        function startDistribution() {
            if (timerNextDistribution!==undefined) {
                console.log("timerNextDistribution already in use");
                return;
            }
            timerNextDistribution = setInterval(() => {
                getNextDistribution();
            }, 1000);
        }
        function stopDistribution() {
            clearInterval(timerNextDistribution);
            timerNextDistribution=undefined
        }

        function setMode(newmode) {
            switch (newmode) {
                case MANUALMODE:
                    setAjaxManual();
                    console.log("Setting manual mode");
                    erogazione.disabled=true;
                    quantita.disabled=true;
                    periodo.disabled=true;
                    actualmode.innerHTML="Modalità MANUALE";
                    console.log("Start read switch");
                    startReadSwitches();
                    startDistribution();
                    btn_setswitch.hidden=true;
                    break;
                case REMOTEMODE:
                    setAjaxRemote();
                    console.log("Set remote mode");
                    erogazione.disabled=false;
                    quantita.disabled=false;
                    periodo.disabled=false;
                    actualmode.innerHTML="Modalità REMOTA";
                    console.log("Start Distribution");
                    startDistribution();
                    console.log("Stop read switch");
                    stopReadSwitches();
                    //stopDistribution();
                    setSwitch()
                    btn_setswitch.hidden=true;
                    break;
                default:
                    alert("Error on setMode");
            }
        }

        /*function switchMode() {
            if (mode.value==MANUALMODE) {
                //mode.value='REMOTE';
                setAjaxManual();
                setMode(REMOTEMODE);
            } else if (mode.value==REMOTEMODE) {
                //mode.value='MANUAL';
                setAjaxRemote();
                setMode(MANUALMODE);
            }
        }*/
        // ritardo erogazione: in ore
        const s1vals = {
            '0': 1, '1':3, '2':6, '3':12, '4':24
        }
        // quantità:  in grammi
        const s2vals = {
            '0': 100, '1':200, '2':300, '3':400, '4':500
        }
        // periodo:   in ore
        const s3vals = {
            '0': 1, '1':3, '2':6, '3':12, '4':24
        }
        const svals = {
            'erogazione': s1vals,
            'quantita': s2vals,
            'periodo': s3vals
        }
        /*function eroga() {
            xhr = new XMLHttpRequest();
            xhr.open('GET', 'http://192.168.43.185/eroga' );
            xhr.onload = function() {
                console.log(xhr.response);
            };
            xhr.send();
        }*/

        function setAjaxSwitch() {
            ajax('POST', 'setswitch', (response)=>{
                console.log(response);
            });
        }
        
        function readswitch() {
            xhr = new XMLHttpRequest();
            xhr.open('GET', 'http://192.168.43.185/switch' );
            xhr.onload = function() {
                //console.log(xhr.response);
                vals = JSON.parse(xhr.response);
                setSwitches(vals);
            };
            xhr.send();
        }

        function setSwitch(el, val) {
            el.value=val;
            updateSwitchVals(el)
        }

        function setSwitches(vals) {
            for (id in vals) {
                el = document.getElementById(id);
                setSwitch(el, vals[id]);
            }
        }

        function updateSwitchVals(el) {
            vals = svals[el.id];
            pel = document.getElementById(el.id+'_val');
            pel.innerHTML = vals[el.value];
            //console.log(vals);
        }

        function readMode(callback) {
            let xhr = new XMLHttpRequest();
            xhr.open('GET', URL+'mode' );
            xhr.onload = function() {
                console.log(xhr.response);
                callback(xhr.response);
            };
            xhr.onerror = function() {
                console.log(xhr);
                alert("error cannot connect");
            }
            xhr.send();
        }
        function setAjaxManual() {
            ajax('GET', 'manual', (response)=>{
                console.log(response);
                //setMode(MANUALMODE);
            });
        }
        function setAjaxRemote() {
            ajax('GET', 'remote', (response)=>{
                console.log(response);
                //setMode(REMOTEMODE);
            });
        }



        erogazione.addEventListener('change', (e) => {
            console.log(e);
            updateSwitchVals(e.target);
        });
        quantita.addEventListener('change', (e) => {
            console.log(e);
            updateSwitchVals(e.target);
        });
        periodo.addEventListener('change', (e) => {
            console.log(e);
            updateSwitchVals(e.target);
        });
        updateSwitchVals(erogazione);
        updateSwitchVals(quantita);
        updateSwitchVals(periodo);

        readMode((mode)=>setMode(mode));
        //setMode(MANUALMODE)

        function stopAll() {
            stopReadSwitches();
        }

        function getNextDistribution() {
            ajax('GET', 'nextdis', (response)=>{
                //console.log(response);
                val = JSON.parse(response);
                nextdis.innerHTML = "Prossima erogazione: "+val+"s";
            });
        }
    </script>
</body>
</html>
